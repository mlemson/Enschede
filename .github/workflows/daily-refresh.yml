name: Bronnen, nieuws en agenda verversen
on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt pytest
      - name: Publieke index verversen
        run: python tools/build_source_index.py
      - name: Nieuws en agenda verversen
        run: |
          python tools/refresh_updates.py
          python tools/monitor_news.py
      - name: Bewaar index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-index.js source-index.json auto-updates.js data/news-review.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiseer sociale informatie, nieuws en activiteiten'
            git push origin HEAD:main
          fi
      - name: Controleer en bouw website
        run: |
          python -m pytest tests -q
          python tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publiceer geactualiseerde website
        id: deployment
        uses: actions/deploy-pages@v4
